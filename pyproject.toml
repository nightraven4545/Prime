[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prime"
version = "0.1.0"
description = "Tech & AI Value Diagnostic: maturity, priorities, business case and roadmap for a bank"
requires-python = ">=3.11"
dependencies = ["pandas>=2", "numpy", "pyyaml", "plotly>=5", "streamlit>=1.30"]

[project.optional-dependencies]
dev = ["pytest"]
llm = ["anthropic"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
