# Sample Bank is fictional. Every figure here is an illustrative assumption for a
# mid-sized Indian private-sector bank, not data about any real institution.
name: Sample Bank
description: Fictional mid-sized Indian private-sector bank
currency: INR crore

# Annual baselines that the use cases act on (INR crore).
baseline:
  total_income: 12000          # net interest income + other income
  operating_expenses: 5800
  operations_cost: 1100        # back-office processing, branches' service work
  contact_centre_cost: 320
  tech_dev_cost: 450           # in-house and contracted software engineering
  third_party_tech_spend: 520  # software licences, cloud, IT services
  compliance_cost: 260         # KYC, AML, regulatory reporting
  collections_cost: 240
  marketing_spend: 380
  credit_cost: 1400            # provisions for loan losses
  fraud_loss: 70
  retail_income: 4200
  sme_income: 1900

